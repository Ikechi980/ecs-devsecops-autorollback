name: Install trivy
description: Pinned, checksum-verified trivy binary (instead of trivy-action, whose tags were hijacked in a 2026 supply-chain attack).

runs:
  using: composite
  steps:
    - name: Install trivy
      shell: bash
      env:
        TRIVY_VERSION: "0.75.0"
        TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
      run: |
        tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        curl -sSfL -o "$tarball" \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
        echo "${TRIVY_SHA256}  ${tarball}" | sha256sum --check --strict
        tar -xzf "$tarball" trivy
        sudo install -m 0755 trivy /usr/local/bin/trivy
        rm -f "$tarball" trivy
