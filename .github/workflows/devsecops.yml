name: devsecops

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      break_health:
        description: "Build a deliberately unhealthy image (rollback drill)"
        type: boolean
        default: false

# Least privilege by default; jobs opt in to anything more.
permissions:
  contents: read

jobs:
  security-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      TRIVY_VERSION: "0.75.0"
      TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
    steps:
      # Actions are pinned to full commit SHAs (tags are mutable).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
          persist-credentials: false

      # Pinned gitleaks binary, verified against its published checksum,
      # rather than a third-party action.
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$tarball" gitleaks

      - name: Secrets scan (gitleaks)
        run: gitleaks git . --redact --no-banner --exit-code 1 --verbose

      # Same pattern as gitleaks: pinned, checksum-verified binary instead of
      # trivy-action (whose tags were hijacked in a 2026 supply-chain attack).
      - name: Install trivy
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm -f "$tarball" trivy

      - name: Dependency scan (trivy fs)
        run: |
          trivy fs app/ \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress

      # Hash-locked install (.github/requirements/checkov.txt, generated with
      # pip-compile --generate-hashes on Python 3.12 = the runner's python3).
      - name: Install checkov
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_CACHE_DIR: "1"
        run: |
          python3 -m venv "$RUNNER_TEMP/checkov"
          "$RUNNER_TEMP/checkov/bin/pip" install --require-hashes -r .github/requirements/checkov.txt
          echo "$RUNNER_TEMP/checkov/bin" >> "$GITHUB_PATH"

      # Prove the custom policy still rejects services that can't roll back.
      - name: Policy unit tests (CKV_IKE_ECS_1)
        run: bash policies/checkov/tests/run.sh

      - name: IaC scan (checkov)
        run: |
          checkov -d terraform \
            --framework terraform \
            --external-checks-dir policies/checkov \
            --skip-download \
            --compact \
            --quiet
